<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Otaku</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

    <header class="menu">

        <div class="logo">
            ☰ <span>OTAKU</span>
        </div>

        <div class="voltar-home">
            <a href="index.html">
                ← Voltar para o início
            </a>
        </div>

    </header>


    <main class="login-container">

        <div class="login-caixa">

            <div class="login-topo">
                <span>🎌 OTAKU</span>

                <h1>Bem-vindo</h1>

                <p>
                    Entre na sua conta para continuar.
                </p>
            </div>


            <form id="formLogin">

                <div class="campo-login">

                    <label for="loginEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="loginSenha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="loginSenha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <p
                    class="mensagem-login"
                    id="mensagemLogin">
                </p>


                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Entrar
                </button>

            </form>


            <div class="ir-cadastro">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar minha conta
                </a>

            </div>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
